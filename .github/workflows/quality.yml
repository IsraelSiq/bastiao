name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate JSON
        run: python -m json.tool rag/openwebui-config.json >/dev/null

      - name: Validate Python syntax
        run: python -m compileall -q scripts

      - name: Run Explorer tests
        run: python -m pytest tests/test_explorer.py -q

      - name: Run diagnostic tests
        run: python -m pytest tests/test_diagnostico_operacional.py -q

      - name: Run authorization tests
        run: python -m pytest tests/test_autorizacao.py -q

      - name: Run Builder tests
        run: python -m pytest tests/test_builder.py -q

      - name: Run task engine tests
        run: python -m pytest tests/test_tarefas.py -q

      - name: Run worker lifecycle tests
        run: python -m pytest tests/test_worker.py -q

      - name: Run tool registry tests
        run: python -m pytest tests/test_ferramentas.py -q

      - name: Run tool adapters and executor tests
        run: python -m pytest tests/test_adaptadores_executor.py -q

      - name: Run task panel tests
        run: python -m pytest tests/test_painel_tarefas.py -q

      - name: Validate RAG configuration
        run: python scripts/setup_openwebui.py --repo-root . --skip-ollama --strict

      - name: Check for private keys
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' \
            '-----BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY-----' .; then
            echo "Private key material found in tracked files."
            exit 1
          fi

      - name: Check for common secret assignments
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' \
            '(api[_-]?key|secret|password|token)[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']+["'\'']' .; then
            echo "Possible hard-coded secret assignment found."
            exit 1
          fi
