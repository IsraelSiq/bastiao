services:
  ollama:
    image: ollama/ollama@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ./ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm

  open-webui:
    # v0.11.4 (standard image, not slim), pinned by digest.
    image: ghcr.io/open-webui/open-webui@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
    container_name: open-webui
    restart: unless-stopped
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      # Accounts, chats, uploads and the vector DB live here; without this mount
      # they are lost whenever the container is recreated.
      - ./data:/app/backend/data
    ports:
      - "${OPEN_WEBUI_BIND_ADDRESS:-127.0.0.1}:3000:8080"
    depends_on:
      - ollama
