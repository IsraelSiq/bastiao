# Exemplo sanitizado. Copie para o host como compose.yml e defina WEBUI_SECRET_KEY fora do Git.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ./ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      WEBUI_SECRET_KEY: "CHANGE_ME_USE_A_RANDOM_SECRET"
      OLLAMA_BASE_URL: "http://ollama:11434"
    volumes:
      - ./data:/app/backend/data
    depends_on:
      - ollama
