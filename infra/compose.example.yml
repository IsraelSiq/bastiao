# Exemplo sanitizado e reproduzivel. Nao aplicar sem revisar a interface de acesso.
# Os digests abaixo correspondem as imagens observadas no host em 2026-09-08.
services:
  ollama:
    image: ollama/ollama@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ./ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui@sha256:1a6399d237dc392a2313e0ca826020b3fd5d22536357840eb63393d18dc8b924
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_BIND_ADDRESS:?defina o endereco privado de bind}:3000:8080"
    environment:
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?defina WEBUI_SECRET_KEY fora do Git}"
      OLLAMA_BASE_URL: "http://ollama:11434"
      RAG_EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
      USE_EMBEDDING_MODEL_DOCKER: "sentence-transformers/all-MiniLM-L6-v2"
      USE_OLLAMA_DOCKER: "false"
    volumes:
      - ./data:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8080/health | jq -ne 'input.status == true'"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      ollama:
        condition: service_healthy
